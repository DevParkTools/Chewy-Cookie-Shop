const slots = [];

function slotFor(id) { for (let i = 0; i < slots.length; i++) if (slots[i].id === id) return slots[i]; return null; }

function beginGrab(s, x, z) {
  const r = DC.grabRadius, inv = 1 / (0.5 * r * r);
  let n = 0;
  for (let k = 0; k < insideCount && n < 80; k++) {
    const id = inside[k];
    if (grabbed[id] || tear[id]) continue;
    const dx = px[id] - x, dz = pz[id] - z;
    const w = Math.exp(-(dx * dx + dz * dz) * inv);
    if (w > 0.08) { s.idx[n] = id; s.w[n] = w; n++; }
  }
  if (n < 2) return false;
  for (let k = 0; k < n; k++) { grabbed[s.idx[k]] = 1; vx[s.idx[k]] = 0; vz[s.idx[k]] = 0; }
  s.n = n; s.lx = x; s.lz = z;
  return true;
}

  if (G.screen !== 'play') return;
  e.preventDefault();
  const p = worldPoint(e);
  if (!p) return;
  if (G.phase === 'pull') {
    if (slotFor(e.pointerId)) return;
    const s = slotFor(-1);
    if (!s) return;
    s.id = e.pointerId;
    if (!beginGrab(s, p.x, p.z)) { s.id = -1; return; }
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    if (save.pulls === 0 && !G.grabHinted) { G.grabHinted = true; save.pulls = 1; save.gold += 5; store.save(save); updateGold(); flash('chewy', 900); burst(p.x, 0.3, p.z, 10, 0xffd36e); sfx('coin'); vib(15); unlockAch(0); }

    G.sx = clamp(p.x, -3, 3); G.sz = clamp(p.z, -3, 3);
    G.stampId = e.pointerId;
    updateGhost();

});
canvas.addEventListener('pointermove', (e) => {
  if (G.screen !== 'play') return;
  const p = worldPoint(e);
  if (!p) return;
  if (G.phase === 'pull') {
    const s = slotFor(e.pointerId);
    if (!s || !s.n) return;
    let dx = p.x - s.lx, dz = p.z - s.lz;
    const l = Math.sqrt(dx * dx + dz * dz);
    if (l > 0.6) { dx *= 0.6 / l; dz *= 0.6 / l; }
    s.lx += dx; s.lz += dz;
    G.pullMoved = true;
    for (let k = 0; k < s.n; k++) {
      const id = s.idx[k];
      if (tear[id]) { grabbed[id] = 0; continue; }
      px[id] += dx * s.w[k] * SET.sens; pz[id] += dz * s.w[k] * SET.sens;
      const r2 = px[id] * px[id] + pz[id] * pz[id];
      if (r2 > 12) { const f = Math.sqrt(12 / r2); px[id] *= f; pz[id] *= f; }
      mx[id] = px[id]; mz[id] = pz[id];

function beginRebind(a, b) {

}
function openSettings() { buildSettingsOnce(); show('settings', true); }

let settingsBuilt = false;

const qualState = { level: 2, auto: false };
let lowEnd = false;
try { lowEnd = (navigator.hardwareConcurrency || 8) <= CONFIG.lowEnd.cores || (navigator.deviceMemory || 8) <= CONFIG.lowEnd.memory; } catch (e) { lowEnd = false; }
function applyQuality(level) {
  const q = CONFIG.quality[level];

  view.scale = Math.min(view.scale, q.scale);
  view.qMax = q.scale;
  sun.castShadow = !!(q.shadow && SET.shadow);

function applySettings() {

  audioApplyVol();
  if (lang !== SET.lang) { lang = SET.lang; refreshTexts(); if (settingsBuilt) refreshSettingsText(); }
  view.user = SET.rs;
  qualState.auto = SET.q === 3;
  applyQuality(SET.q === 3 ? (lowEnd ? 1 : 2) : SET.q);
  document.body.classList.toggle('cb', !!SET.cb);
  document.body.classList.toggle('one', !!SET.one);
  $('fps').classList.toggle('hide', !SET.fpsShow);

}

const photo = { on: false, angle: 0, slow: false };
const shake = { amp: 0 };
const camPresets = [[0, 1, 0.02], [0, 0.55, 0.85], [0.8, 0.7, 0.7]];

$('bSlow').addEventListener('click', () => { photo.slow = !photo.slow; $('bSlow').classList.toggle('on', photo.slow); });

  const d = camBase.length() * 0.95, p = camPresets[photo.angle];
  camTP.set(p[0] * d, p[1] * d, p[2] * d);
  camTL.set(0, 0, -0.1);
}

function doShake(a) { shake.amp = Math.max(shake.amp, a); }

  const a = shake.amp * (SET.shake ? 1 : 0);
  camera.position.x += (Math.random() - 0.5) * a;
  camera.position.y += (Math.random() - 0.5) * a;
  shake.amp *= Math.exp(-CONFIG.shake.decay * dt);
}

const joy = { on: false, id: -1, x: 0, z: 0, cx: 0, cy: 0, r: 1 };

function joyShown() { return (SET.joyOn || SET.one) && G.screen === 'play' && G.phase === 'stamp'; }
const joyEl = $('joy'), knobEl = $('joyKnob');
joyEl.addEventListener('pointerdown', (e) => {

function joyMove(e) {

  const l = Math.sqrt(dx * dx + dy * dy);

  joy.x = l < CONFIG.joy.dead ? 0 : dx; joy.z = l < CONFIG.joy.dead ? 0 : dy;

const fpsInfo = { acc: 0, n: 0, last: 0 };

const recover = { t: 0 };
function recoverCheck(dt) {
  recover.t += dt;
  if (recover.t < 1) return;
  recover.t = 0;
  if (G.screen !== 'play') return;
  if (G.phase === 'pull' || G.phase === 'stamp') {
    let alive = 0;
    for (let k = 0; k < insideCount; k++) if (!tear[inside[k]]) alive++;
    if (alive < insideCount * CONFIG.autoRecover.minAlive) { releaseAll(); setPhase('pull'); kneadDough(); doughRefresh(); flash('recovered', 1400); }
  }
  if (G.phase !== 'stamp') G.stampId = -1;
  if (G.phase === 'bake' && doughMesh.visible) doughMesh.visible = false;
}

const perf = { n: 0, sum: 0 };
function perfSample(dt) {
  perf.sum += dt; perf.n++;
  if (perf.n < CONFIG.fps.sample) return;
  const fps = perf.n / perf.sum;
  perf.n = 0; perf.sum = 0;
  if (fps < CONFIG.fps.low && view.scale > CONFIG.pixelRatioMin) { view.scale = Math.max(CONFIG.pixelRatioMin, view.scale - CONFIG.fps.step); resize(); }
  else if (fps < CONFIG.fps.low && qualState.auto && qualState.level > 0) applyQuality(qualState.level - 1);
  else if (fps > CONFIG.fps.high && view.scale < (view.qMax || 1)) { view.scale = Math.min(view.qMax || 1, view.scale + CONFIG.fps.step * 0.5); resize(); }
}

function update(dt) {
  if (G.screen === 'ad') { adUpdate(dt); fxUpdate(dt); return; }
  if (G.screen !== 'pause') bgmUpdate();
  if (G.screen !== 'play' && G.screen !== 'result') { fxUpdate(dt); return; }
  if (G.screen === 'play') {
    acc += dt;
    let steps = 0;
    while (acc >= CONFIG.fixedStep && steps < CONFIG.maxSteps) {
      if (G.phase === 'pull' || G.phase === 'stamp') doughStep(CONFIG.fixedStep);
      acc -= CONFIG.fixedStep; steps++;
    }
    if (steps === CONFIG.maxSteps) acc = 0;
    joyUpdate(dt); recoverCheck(dt);
    if (G.rush) { if (G.phase !== 'ad') rushTick(dt); }
    else if (G.phase !== 'serve' && G.phase !== 'ad') {
      G.t += dt;
      const sec = Math.floor(G.t);
      if (sec !== G.tSec) { G.tSec = sec; $('tmr').textContent = '⏱ ' + sec; }
    }
    if (G.phase === 'pull' || G.phase === 'stamp') {
      if (dstat.dirty) { doughRefresh(); threadsUpdate(); }
      if (G.pullMoved) {
        G.pullSfxT -= dt;
        if (G.pullSfxT <= 0) { sfx('stretch', dstat.maxS); G.pullSfxT = 0.12; }
        G.pullMoved = false;
        if (dstat.maxS > G.maxPull) G.maxPull = dstat.maxS;
      }
    } else if (G.phase === 'bake') {
      G.bakeP += dt / CONFIG.bake.time;
      const p = Math.min(G.bakeP, 1.0), k = Math.min(p / CONFIG.bake.zoneMax, 1);
      bakeColor(p);
      const sz = CONFIG.cutter.size * (1 + 0.08 * k);
      cookie.scale.set(sz, Math.max(0.06, G.baseScaleY) * (1 + CONFIG.bake.puff * k), sz);
      $('cur').style.left = p * 100 + '%';
      setSizzle(true);
      if (dbg.god && G.bakeP > CONFIG.bake.zoneMax - 0.02) G.bakeP = CONFIG.bake.zoneMax - 0.02;
      if (G.bakeP >= 1.05) takeOut();
    } else if (G.phase === 'serve') {
      setSizzle(false);
      G.serveT += dt;
      cookie.rotation.y += dt * 2;
      if (G.serveT > (G.rush ? RUSH.serve : 1.8)) {
        if (G.rush) rushNext();
        else if (G.item + 1 < G.order.items.length) { G.item++; beginItem(); flash('item', 600); }
        else showResult();
      }
    }
  } else {
    cookie.rotation.y += dt * 1.6;
  }
  if (topMesh.visible) {
    const k = cookie.scale.x / CONFIG.cutter.size;
    topMesh.position.set(cookie.position.x, cookie.position.y + cookie.scale.y + 0.02, cookie.position.z);
    topMesh.rotation.y = cookie.rotation.y;
    topMesh.scale.set(k, 1, k);
  }
  fxUpdate(dt);
}

let lastRender = 0;
function frame(now) {
  requestAnimationFrame(frame);
  if (G.screen === 'error') return;
  const cap = SET.fps === 0 ? 30 : SET.fps === 1 ? 60 : 0;
  if (cap && now - lastRender < 1000 / cap - 1.5) return;
  lastRender = now;
  if (clockReset) { lastT = now; clockReset = false; }
  let dt = (now - lastT) / 1000;
  lastT = now;
  if (dt > CONFIG.maxDelta) dt = CONFIG.maxDelta;
  if (dt < 0) dt = 0;
  const ts = photo.slow ? CONFIG.photo.slow : 1;
  try {
    update(dt * ts);
    custUpdate(dt * ts);
    envUpdate(dt, G.phase === 'bake' && G.screen === 'play' ? 1 : 0);
    camUpdate(dt);
    renderer.render(scene, camera);
    if (G.screen === 'play') perfSample(dt);
    fpsUpdate(dt);
  } catch (err) { showError(err && err.message ? err.message : 'error'); }
}
