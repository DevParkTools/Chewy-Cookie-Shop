const cRaw = new THREE.Color(0xf4dca8), cGold = new THREE.Color(0xd49a4a), cBrown = new THREE.Color(0x7a4a22), cBurn = new THREE.Color(0x2a1a10);
function bakeColor(p) {
  const B = CONFIG.bake;
  if (p < B.zoneMin) return cookieMat.color.copy(cRaw).lerp(cGold, p / B.zoneMin * 0.6);
  if (p < B.zoneMax) return cookieMat.color.copy(cRaw).lerp(cGold, 0.6 + 0.4 * (p - B.zoneMin) / (B.zoneMax - B.zoneMin));
  if (p < B.burn) return cookieMat.color.copy(cGold).lerp(cBrown, (p - B.zoneMax) / (B.burn - B.zoneMax));
  return cookieMat.color.copy(cBrown).lerp(cBurn, clamp((p - B.burn) / (1 - B.burn), 0, 1));
}
function bakeScore(p) {
  const B = CONFIG.bake;
  if (p < B.zoneMin) return 0.2 + 0.5 * p / B.zoneMin;
  if (p <= B.zoneMax) return 1;
  if (p <= B.burn) return 1 - 0.5 * (p - B.zoneMax) / (B.burn - B.zoneMax);
  return 0.05;
}

function takeOut() {
  if (G.phase !== 'bake' || G.screen !== 'play') return;
  const p = Math.min(G.bakeP, 1);
  if (p > CONFIG.bake.burn && !G.revived) { offerAd(p); return; }
  finalizeItem(p);
}
function offerAd(p) {
  G.burntP = p;
  setPhase('ad');
  show('adOffer', true);

function finalizeItem(p) {
  const B = CONFIG.bake, it = G.order.items[G.item];
  const r = orderThick[it.thick], th = G.thickAvg;
  const dist = th < r[0] ? r[0] - th : th > r[1] ? th - r[1] : 0;
  const thScore = clamp(1 - dist / 0.12, 0, 1);
  const topOk = it.top ? (G.top === it.top ? 1 : 0.6) : (G.top ? 0.85 : 1);
  const acc = clamp(G.cover, 0, 1) * (G.ci === it.shape ? 1 : 0.35) * topOk;
  const fin = 0.5 * thScore + 0.5 * bakeScore(p);
  const state = p < B.zoneMin ? 'raw' : p <= B.zoneMax ? 'perfect' : p <= B.burn ? 'perfect' : 'burnt';
  G.results.push({ acc, fin, perfect: p >= B.zoneMin && p <= B.zoneMax });
  flash(state === 'perfect' ? 'perfect' : state, 1100);
  sfx(state === 'perfect' ? 'ding' : 'fail');
  setPhase('serve');
  G.serveT = 0;
  burst(G.sx, 0.5, G.sz, 18, 0xffe08a);
}

function showResult() {

  let acc = 0, fin = 0, perf = 0;
  for (let i = 0; i < n; i++) { acc += G.results[i].acc; fin += G.results[i].fin; if (G.results[i].perfect) perf++; }
  acc /= n; fin /= n;
  const spd = clamp(1 - G.t / o.limit, 0, 1);
  const total = Math.round(100 * (CONFIG.score.wAcc * acc + CONFIG.score.wFin * fin + CONFIG.score.wSpd * spd));
  let tip = CONFIG.score.tipBase + Math.round(total * CONFIG.score.goldPerPoint);
  if (o.big) tip *= CONFIG.bonus.bigTip;

  let gold = tip + perfBonus;

  save.xp += xp;

  if (o.daily) { save.daily = dayKey(); unlockAch(6); } else save.level++;
  for (let i = 0; i < cutters.length; i++) if (!(save.unlocked & (1 << i)) && save.level >= cutUnlockAt[i]) { save.unlocked |= 1 << i; lines.push('🔓 ' + T('unlockCut') + T('c' + i)); }
  for (let i = 1; i < 4; i++) if (!(save.tops & (1 << i)) && save.level >= topUnlockAt[i]) { save.tops |= 1 << i; lines.push('🔓 ' + T('unlockTop') + T('t' + i)); }
  save.gold += gold;
  if (total >= 85) save.streak++; else save.streak = 0;

  $('rS').innerHTML = '<span>' + T('acc') + '</span><span>' + Math.round(acc * 100) + '</span><span>' + T('fin') + '</span><span>' + Math.round(fin * 100) + '</span><span>' + T('spd') + '</span><span>' + Math.round(spd * 100) + '</span>';
  const kind = total >= 80 ? 'good' : total >= 45 ? 'mid' : 'bad';

  custReact(kind);
  if (kind === 'good') { sfx('win'); vib([30, 40, 30]); burst(0, 1, -2.2, 24, 0xff7a9a); } else if (kind === 'bad') sfx('fail');
  sfx('coin');
  G.screen = 'result';
  show('result', true); show('top', false); show('bot', false);
}

const ray = new THREE.Raycaster();
const ndc = new THREE.Vector2();
const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
const hitV = new THREE.Vector3();
function worldPoint(e) {
  ndc.set((e.clientX / view.w) * 2 - 1, -(e.clientY / view.h) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  return ray.ray.intersectPlane(plane, hitV) ? hitV : null;
}

const slots = [];
for (let i = 0; i < 3; i++) slots.push({ id: -1, n: 0, idx: new Int16Array(80), w: new Float32Array(80), lx: 0, lz: 0 });
function slotFor(id) { for (let i = 0; i < slots.length; i++) if (slots[i].id === id) return slots[i]; return null; }
function releaseSlot(s) {
  for (let k = 0; k < s.n; k++) grabbed[s.idx[k]] = 0;
  s.n = 0; s.id = -1;
}
function releaseAll() { for (let i = 0; i < slots.length; i++) if (slots[i].id !== -1) releaseSlot(slots[i]); }

function beginGrab(s, x, z) {
  const r = DC.grabRadius, inv = 1 / (0.5 * r * r);
  let n = 0;
  for (let k = 0; k < insideCount && n < 80; k++) {
    const id = inside[k];
    if (grabbed[id] || tear[id]) continue;
    const dx = px[id] - x, dz = pz[id] - z;
    const w = Math.exp(-(dx * dx + dz * dz) * inv);
    if (w > 0.08) { s.idx[n] = id; s.w[n] = w; n++; }
  }
  if (n < 2) return false;
  for (let k = 0; k < n; k++) { grabbed[s.idx[k]] = 1; vx[s.idx[k]] = 0; vz[s.idx[k]] = 0; }
  s.n = n; s.lx = x; s.lz = z;
  return true;
}

canvas.addEventListener('pointerdown', (e) => {
  if (G.screen !== 'play') return;
  e.preventDefault();
  const p = worldPoint(e);
  if (!p) return;
  if (G.phase === 'pull') {
    if (slotFor(e.pointerId)) return;
    const s = slotFor(-1);
    if (!s) return;
    s.id = e.pointerId;
    if (!beginGrab(s, p.x, p.z)) { s.id = -1; return; }
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    if (save.pulls === 0 && !G.grabHinted) { G.grabHinted = true; save.pulls = 1; save.gold += 5; store.save(save); updateGold(); flash('chewy', 900); burst(p.x, 0.3, p.z, 10, 0xffd36e); sfx('coin'); vib(15); unlockAch(0); }
    sfx('pop');
  } else if (G.phase === 'stamp') {
    G.sx = clamp(p.x, -3, 3); G.sz = clamp(p.z, -3, 3);
    G.stampId = e.pointerId;
    updateGhost();
  }
});
canvas.addEventListener('pointermove', (e) => {
  if (G.screen !== 'play') return;
  const p = worldPoint(e);
  if (!p) return;
  if (G.phase === 'pull') {
    const s = slotFor(e.pointerId);
    if (!s || !s.n) return;
    let dx = p.x - s.lx, dz = p.z - s.lz;
    const l = Math.sqrt(dx * dx + dz * dz);
    if (l > 0.6) { dx *= 0.6 / l; dz *= 0.6 / l; }
    s.lx += dx; s.lz += dz;
    G.pullMoved = true;
    for (let k = 0; k < s.n; k++) {
      const id = s.idx[k];
      if (tear[id]) { grabbed[id] = 0; continue; }
      px[id] += dx * s.w[k] * SET.sens; pz[id] += dz * s.w[k] * SET.sens;
      const r2 = px[id] * px[id] + pz[id] * pz[id];
      if (r2 > 12) { const f = Math.sqrt(12 / r2); px[id] *= f; pz[id] *= f; }
      mx[id] = px[id]; mz[id] = pz[id];
    }
  } else if (G.phase === 'stamp' && G.stampId === e.pointerId) {
    G.sx = clamp(p.x, -3, 3); G.sz = clamp(p.z, -3, 3);
    updateGhost();
  }
});
function endPointer(e) {
  const s = slotFor(e.pointerId);
  if (s) { releaseSlot(s); sfx('boing'); }
  if (G.screen === 'play' && G.phase === 'stamp' && G.stampId === e.pointerId) { G.stampId = -1; doStamp(); }
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
['contextmenu', 'gesturestart', 'gesturechange', 'dblclick'].forEach((n) => document.addEventListener(n, (e) => e.preventDefault()));

function primary() {
  if (G.screen === 'title') startGame(false);
  else if (G.screen === 'result') { show('result', false); G.screen = 'play'; show('top', true); show('bot', true); startGame(false); }
  else if (G.screen === 'play') {
    if (G.phase === 'pull') toStamp();
    else if (G.phase === 'stamp') doStamp();
    else if (G.phase === 'bake') takeOut();
  } else if (G.screen === 'pause') resumeGame();
}

window.addEventListener('keydown', (e) => {
  if (rebindBtn) {
    e.preventDefault();
    if (e.code !== 'Escape') {
      for (const k in KB) if (KB[k] === e.code && k !== rebindAct) KB[k] = KB[rebindAct];
      KB[rebindAct] = e.code;
      persistSettings();
    }
    rebindBtn = null; refreshSettingsText();
    return;
  }
  if (e.repeat || G.screen === 'error') return;
  const k = e.code;
  const dlgOpen = !$('dlg').classList.contains('hide');
  if (k === KB.pause || k === 'Escape') {
    if (dlgOpen) show('dlg', false);
    else if (!$('help').classList.contains('hide')) show('help', false);
    else if (!$('settings').classList.contains('hide')) closeSettings();
    else if (photo.on) setPhoto(false);
    else if (G.screen === 'play') pauseGame();
    else if (G.screen === 'pause') resumeGame();
    return;
  }
  if (dlgOpen || !$('settings').classList.contains('hide')) return;
  if (k === KB.fs) { toggleFs(); return; }
  if (k === KB.photo) { setPhoto(!photo.on); return; }
  if (k === KB.help) { show('help', $('help').classList.contains('hide')); return; }
  if (k === KB.act || k === 'Enter') { if (G.screen === 'ad' || G.screen === 'intro') return; e.preventDefault(); primary(); }
  else if (G.screen === 'play') {
    if (k === KB.knead) kneadAgain();
    else if (k.startsWith('Digit')) { const n = (+k.slice(5) + 9) % 10; selectCutter(n); }
    else if (k === KB.top) { let n = (G.top + 1) % 4; while (n && !(save.tops & (1 << n))) n = (n + 1) % 4; selectTop(n); }

  if (G.screen === 'ad') { adUpdate(dt); fxUpdate(dt); return; }
  if (G.screen !== 'pause') bgmUpdate();
  if (G.screen !== 'play' && G.screen !== 'result') { fxUpdate(dt); return; }
  if (G.screen === 'play') {
    acc += dt;
    let steps = 0;
    while (acc >= CONFIG.fixedStep && steps < CONFIG.maxSteps) {
      if (G.phase === 'pull' || G.phase === 'stamp') doughStep(CONFIG.fixedStep);
      acc -= CONFIG.fixedStep; steps++;
    }
    if (steps === CONFIG.maxSteps) acc = 0;
    joyUpdate(dt); recoverCheck(dt);
    if (G.phase !== 'serve' && G.phase !== 'ad') {
      G.t += dt;
      const sec = Math.floor(G.t);
      if (sec !== G.tSec) { G.tSec = sec; $('tmr').textContent = '⏱ ' + sec; }
    }
    if (G.phase === 'pull' || G.phase === 'stamp') {
      if (dstat.dirty) { doughRefresh(); threadsUpdate(); }
      if (G.pullMoved) {
        G.pullSfxT -= dt;
        if (G.pullSfxT <= 0) { sfx('stretch', dstat.maxS); G.pullSfxT = 0.12; }
        G.pullMoved = false;
        if (dstat.maxS > G.maxPull) G.maxPull = dstat.maxS;
      }
    } else if (G.phase === 'bake') {
      G.bakeP += dt / CONFIG.bake.time;
      const p = Math.min(G.bakeP, 1.0), k = Math.min(p / CONFIG.bake.zoneMax, 1);
      bakeColor(p);
      const sz = CONFIG.cutter.size * (1 + 0.08 * k);
      cookie.scale.set(sz, Math.max(0.06, G.baseScaleY) * (1 + CONFIG.bake.puff * k), sz);
      $('cur').style.left = p * 100 + '%';
      setSizzle(true);
      if (dbg.god && G.bakeP > CONFIG.bake.zoneMax - 0.02) G.bakeP = CONFIG.bake.zoneMax - 0.02;
      if (G.bakeP >= 1.05) takeOut();
    } else if (G.phase === 'serve') {
      setSizzle(false);
      G.serveT += dt;
      cookie.rotation.y += dt * 2;
      if (G.serveT > 1.8) {
        if (G.item + 1 < G.order.items.length) { G.item++; beginItem(); flash('item', 600); }
        else showResult();
      }
    }
  } else {
    cookie.rotation.y += dt * 1.6;
  }
  if (topMesh.visible) {
    const k = cookie.scale.x / CONFIG.cutter.size;
    topMesh.position.set(cookie.position.x, cookie.position.y + cookie.scale.y + 0.02, cookie.position.z);
    topMesh.rotation.y = cookie.rotation.y;
    topMesh.scale.set(k, 1, k);
  }
  fxUpdate(dt);
}

let lastRender = 0;
function frame(now) {
  requestAnimationFrame(frame);
  if (G.screen === 'error') return;
  const cap = SET.fps === 0 ? 30 : SET.fps === 1 ? 60 : 0;
  if (cap && now - lastRender < 1000 / cap - 1.5) return;
  lastRender = now;
  if (clockReset) { lastT = now; clockReset = false; }
  let dt = (now - lastT) / 1000;
  lastT = now;
  if (dt > CONFIG.maxDelta) dt = CONFIG.maxDelta;
  if (dt < 0) dt = 0;
  const ts = photo.slow ? CONFIG.photo.slow : 1;
  try {
    update(dt * ts);
    custUpdate(dt * ts);
    envUpdate(dt, G.phase === 'bake' && G.screen === 'play' ? 1 : 0);
    camUpdate(dt);
    renderer.render(scene, camera);
    if (G.screen === 'play') perfSample(dt);
    fpsUpdate(dt);
  } catch (err) { showError(err && err.message ? err.message : 'error'); }
}

resize();
decorApply();
custSet(0);
cust.enter = 0;
applySettings();
refreshTexts();
buildSettingsOnce();
dbgBuild();
selectCutter(0);
setPhase('pull');
G.screen = 'intro';
show('intro', true);
setTimeout(endIntro, 2600);
requestAnimationFrame(frame);
window.__G = G;
window.__game = { SET: () => SET, photo, setPhoto, openSettings, cookie, camera, THREE, G, CONFIG, cutters, save: () => save, doughStep, primary, startGame, pauseGame, resumeGame, view, renderer, dstat, beginGrab, slots, takeOut, showRewardAd, endIntro, decorApply, unlockAch };
</script>
